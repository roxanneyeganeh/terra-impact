<!DOCTYPE html>
<html lang="en" data-tone="dark" data-palette="brand">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Build your bottle | Terra Impact</title>
  <meta name="description" content="Answer six quick questions about your habits and watch them become a unique mosaic pattern on your Terra bottle.">
  <meta name="theme-color" content="#0A121C">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/builder.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="page-builder">
  <a class="skip-link" href="#builder-form">Skip to questions</a>
  <header id="site-header"></header>

  <main id="main" class="builder">
    <!-- 3D preview -->
    <section class="builder-stage" aria-label="Bottle preview">
      <div id="bottle-canvas" class="bottle-canvas" tabindex="0" aria-label="3D bottle preview. Drag, or use the arrow keys, to rotate."></div>
      <div class="stage-loading" id="stage-loading"><span class="spinner" aria-hidden="true"></span>Loading bottle…</div>
      <div class="drag-hint" id="drag-hint" aria-hidden="true"></div>
      <div class="stage-tools">
        <button type="button" class="icon-btn icon-btn--glass" id="save-design" aria-label="Save design" title="Save design"></button>
        <button type="button" class="icon-btn icon-btn--glass" id="reset-view" aria-label="Reset view" title="Reset view"></button>
      </div>
      <div class="stage-swatches" id="stage-swatches" aria-hidden="true"></div>
    </section>

    <!-- Questions -->
    <section class="builder-panel" aria-labelledby="builder-title">
      <div class="panel-head">
        <p class="eyebrow">Build your bottle</p>
        <h1 id="builder-title" class="h2">Your habits, your pattern.</h1>
        <p class="muted">Answer six quick questions. Every answer changes a shape in your mosaic, and the preview updates as you go.</p>
      </div>

      <form id="builder-form" class="builder-form" novalidate>
        <!-- questions are generated from js/lib/survey.js -->
      </form>

      <div class="panel-foot">
        <button type="button" class="btn btn--outline btn--sm" id="reset-answers">Reset answers</button>
      </div>
    </section>

    <!-- Actions -->
    <div class="builder-actions">
      <button type="button" class="btn btn--slate" id="share-design"></button>
      <button type="button" class="btn btn--primary" id="product-details">Product details <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    </div>
  </main>

  <script src="js/site.js"></script>
  <script src="js/vendor/p5.min.js" defer></script>
  <script src="js/lib/survey.js" defer></script>
  <script src="js/lib/mosaic.js" defer></script>
  <script src="js/lib/designs.js" defer></script>
  <script src="js/generator.js" defer></script>
  <script src="js/mosaic-fields.js"></script>
</body>
</html>
