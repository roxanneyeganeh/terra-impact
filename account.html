<!DOCTYPE html>
<html lang="en" data-tone="dark" data-palette="brand">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Account | Terra Impact</title>
  <meta name="theme-color" content="#0A121C">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="page-account">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="auth">
    <div class="auth-card">
      <div class="tabs" role="tablist" aria-label="Account">
        <button type="button" role="tab" id="tab-signup" aria-controls="auth-form" aria-selected="true">Create account</button>
        <button type="button" role="tab" id="tab-login" aria-controls="auth-form" aria-selected="false">Log in</button>
        <span class="tabs-pill" aria-hidden="true"></span>
      </div>

      <h1 class="auth-title" id="auth-title">Create your account</h1>
      <p class="muted auth-sub" id="auth-sub">Save your designs and get early access when we launch.</p>

      <form id="auth-form" class="stack-form" role="tabpanel" aria-labelledby="auth-title" novalidate>
        <label class="field" data-signup-only>
          <span class="field-label">Full name</span>
          <input type="text" name="name" autocomplete="name" required>
        </label>
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <span class="pw-wrap">
            <input type="password" name="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button>
          </span>
        </label>
        <button type="submit" class="btn btn--light btn--block" id="auth-submit">Continue <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
        <p class="form-msg" id="auth-msg" role="status" hidden></p>
      </form>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/site.js"></script>
  <script src="js/account.js"></script>
  <script src="js/lib/survey.js"></script>
  <script src="js/lib/mosaic.js"></script>
  <script src="js/mosaic-fields.js"></script>
</body>
</html>
