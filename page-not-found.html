<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Inter Tight', sans-serif;
      background-color: #0A121C;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    h1 {
      font-size: 100px;
      margin-bottom: 20px;
      font-weight: 700;
      background: linear-gradient(to right, #3498db, #ffffff, #5DADD2);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: slideGradientReverse 5s linear infinite;
    }

    p {
      font-size: 20px;
      font-weight: 300;
      color: #ddd;
      max-width: 500px;
    }

    .buttons {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border: none;
      border-radius: 999px;
      font-weight: 500;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .button-primary {
      background-color: #4da2ff;
      color: white;
    }

    .button-primary:hover {
      background-color: #1c88ff;
    }

    .button-secondary {
      background-color: transparent;
      color: white;
      border: 1px solid white;
    }

    .button-secondary:hover {
      background-color: white;
      color: black;
    }

    @keyframes slideGradientReverse {
      from {
        background-position: 200% 50%;
      }
      to {
        background-position: 0% 50%;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 64px;
      }

      p {
        font-size: 16px;
        padding: 0 20px;
      }
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Oops! The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

  <div class="buttons">
   
    <a href="/index" class="button button-secondary">Go Back</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
  <script src="menu.js"></script>
</body>

</html>
