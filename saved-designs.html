<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saved designs | Terra Impact</title>
  <meta name="theme-color" content="#0A121C">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/saved.css">
</head>
<body class="page-saved">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="container saved">
    <header class="saved-head">
      <div>
        <p class="eyebrow">Your collection</p>
        <h1 class="h1">Saved designs</h1>
        <p class="muted" id="saved-sub">Designs are saved in this browser.</p>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn--outline btn--sm" id="clear-all" hidden>Clear all</button>
        <a href="/generator" class="btn btn--light btn--sm">New design</a>
      </div>
    </header>

    <ul class="saved-grid" id="saved-grid" aria-live="polite"></ul>

    <section class="empty" id="empty" hidden>
      <div class="empty-art" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </div>
      <h2 class="h3">No saved designs yet</h2>
      <p class="muted">Build your bottle and tap the heart to keep a design here.</p>
      <div class="btn-row">
        <a href="/generator" class="btn btn--primary">Start building</a>
        <a href="/trace-by-terra" class="btn btn--outline">Back to shop</a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/site.js"></script>
  <script src="js/lib/survey.js"></script>
  <script src="js/lib/designs.js"></script>
  <script src="js/saved.js"></script>
</body>
</html>
